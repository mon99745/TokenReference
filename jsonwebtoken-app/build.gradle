plugins {
    id 'java'
}

ext {
    libName = 'jsonwebtoken-app'
    libVersion = version
}

bootJar {
    enabled = true
    archiveBaseName.set(libName)
    archiveVersion.set(libVersion)
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.springfox:springfox-swagger-ui:3.0.0'
    implementation 'io.springfox:springfox-boot-starter:3.0.0'

    implementation project(':jsonwebtoken-core')
}